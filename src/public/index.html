<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aprovação de Despesas</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Aprovação de Despesas</h1>
    <p id="current-user" hidden></p>
    <button id="logout-button" type="button" hidden>Sair</button>
  </header>

  <main>
    <section id="login-screen" aria-label="Entrar">
      <h2>Entrar</h2>
      <form id="login-form">
        <div>
          <label for="login-email">E-mail</label>
          <input id="login-email" name="email" type="email" required autocomplete="username" />
        </div>
        <div>
          <label for="login-password">Senha</label>
          <input id="login-password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <button type="submit">Entrar</button>
        <p id="login-error" role="alert"></p>
      </form>
    </section>

    <section id="app-screen" hidden>
      <h2>Nova despesa</h2>
      <form id="new-expense-form">
        <div>
          <label for="new-title">Título</label>
          <input id="new-title" name="title" type="text" required />
        </div>
        <div>
          <label for="new-amount">Valor</label>
          <input id="new-amount" name="amount" type="number" step="0.01" required />
        </div>
        <div>
          <label for="new-category">Categoria</label>
          <input id="new-category" name="category" type="text" required />
        </div>
        <button type="submit">Enviar despesa</button>
        <p id="new-expense-error" role="alert"></p>
      </form>

      <h2>Despesas</h2>
      <div class="table-scroll">
        <table>
          <caption>Suas despesas</caption>
          <thead>
            <tr>
              <th scope="col">Título</th>
              <th scope="col">Categoria</th>
              <th scope="col">Valor</th>
              <th scope="col">Status</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody id="expense-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <template id="row-template">
    <tr>
      <td class="cell-title"></td>
      <td class="cell-category"></td>
      <td class="cell-amount"></td>
      <td class="cell-status"></td>
      <td class="cell-actions"></td>
    </tr>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
